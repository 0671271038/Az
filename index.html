<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ COASTAL - Luxury Fashion & Bouquets</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}.serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="bg-[#fdfbf7] text-gray-900">
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="serif text-2xl font-bold tracking-widest">AZ COASTAL</h1>
    <div class="flex gap-6 items-center">
      <button onclick="filterProducts('all')" class="text-sm tracking-widest hover:underline">ALL</button>
      <button onclick="filterProducts('women')" class="text-sm tracking-widest hover:underline">DRESSES</button>
      <button onclick="filterProducts('bouquet')" class="text-sm tracking-widest hover:underline">BOUQUETS</button>
      <button id="cartBtn" class="relative text-xl">🛒 <span id="cartCount" class="absolute -top-2 -right-3 bg-black text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span></button>
    </div>
  </div>
</header>
<section class="bg-[#f5efe6] py-16 px-4 text-center">
  <h2 class="serif text-5xl font-bold mb-4">Coastal Luxury, Delivered</h2>
  <p class="text-gray-600 max-w-xl mx-auto">Designer dresses & fresh bouquets from Phoenix to Durban. Prices update live.</p>
  <p class="mt-3 text-xs tracking-widest text-gray-500">SUPABASE LIVE • AZ COASTAL</p>
</section>
<main class="max-w-7xl mx-auto px-4 py-10">
  <div id="loading" class="text-center py-20">Loading fresh collection from Supabase...</div>
  <div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
</main>
<div id="cartDrawer" class="fixed inset-0 bg-black/40 hidden z-[60]">
  <div class="absolute right-0 top-0 w-full max-w-sm h-full bg-white p-6 flex flex-col">
    <div class="flex justify-between items-center mb-6"><h3 class="serif text-xl font-bold">Your Bag</h3><button onclick="toggleCart()" class="text-2xl">&times;</button></div>
    <div id="cartItems" class="flex-1 overflow-auto space-y-4"></div>
    <div class="border-t pt-4"><div class="flex justify-between font-bold text-lg mb-4">Total: R<span id="cartTotal">0</span></div><button onclick="checkoutWhatsApp()" class="w-full bg-black text-white py-3 tracking-widest text-sm">CHECKOUT ON WHATSAPP</button></div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://xfgfkqtryehdvxfihidg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DOmvNTyi_8n4h5igNaq1Jw_y0rpLLez';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let allProducts = []; let cart = []; let currentFilter = 'all';
async function loadProducts(){
  const { data, error } = await supabaseClient.from('products').select('*').order('price', {ascending:true});
  if(error){ document.getElementById('loading').innerText = 'Error: '+error.message; return; }
  allProducts = data; document.getElementById('loading').style.display='none'; renderProducts();
}
function renderProducts(){
  const filtered = currentFilter==='all'? allProducts : allProducts.filter(p=>p.category===currentFilter);
  document.getElementById('products').innerHTML = filtered.map(p=>`
    <div class="group bg-white">
      <div class="relative overflow-hidden aspect-[3/4]"><img src="${p.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700"/><span class="absolute top-3 left-3 bg-white text-[10px] tracking-widest px-2 py-1">${p.badge||''}</span></div>
      <div class="p-3"><h4 class="serif text-sm font-medium truncate">${p.name}</h4><p class="mt-1 font-bold">R${p.price}</p><button onclick="addToCart('${p.id}')" class="mt-3 w-full border border-black py-2 text-xs tracking-widest hover:bg-black hover:text-white transition">ADD TO BAG</button></div>
    </div>`).join('');
}
function filterProducts(cat){ currentFilter=cat; renderProducts(); }
function addToCart(id){ const prod = allProducts.find(p=>p.id===id); const existing = cart.find(c=>c.id===id); if(existing) existing.qty++; else cart.push({...prod, qty:1}); updateCart(); toggleCart(true); }
function updateCart(){ document.getElementById('cartCount').innerText = cart.reduce((s,c)=>s+c.qty,0); document.getElementById('cartTotal').innerText = cart.reduce((s,c)=>s+c.price*c.qty,0); document.getElementById('cartItems').innerHTML = cart.map(c=>`<div class="flex gap-3"><img src="${c.image_url}" class="w-16 h-20 object-cover"/><div class="flex-1"><p class="text-sm serif">${c.name}</p><p class="text-xs">R${c.price} x ${c.qty}</p><button onclick="removeFromCart('${c.id}')" class="text-xs underline">remove</button></div></div>`).join('') || '<p class="text-sm text-gray-500">Bag is empty</p>'; }
function removeFromCart(id){ cart = cart.filter(c=>c.id!==id); updateCart(); }
function toggleCart(forceOpen){ const d = document.getElementById('cartDrawer'); if(forceOpen) d.classList.remove('hidden'); else d.classList.toggle('hidden'); }
document.getElementById('cartBtn').addEventListener('click', ()=>toggleCart());
document.getElementById('cartDrawer').addEventListener('click', (e)=>{ if(e.target.id==='cartDrawer') toggleCart(); });
function checkoutWhatsApp(){ if(cart.length===0) return; let msg = 'Hi AZ COASTAL! I want to order:%0A'; cart.forEach(c=>{ msg+= `- ${c.name} (R${c.price} x ${c.qty})%0A`; }); msg+= `%0ATotal: R${document.getElementById('cartTotal').innerText}`; window.open(`https://wa.me/27600000000?text=${msg}`, '_blank'); }
loadProducts();
</script>
</body>
</html>
